name: iOS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild -project ToastDemo.xcodeproj \
            -scheme "ToastDemo" \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            build

      - name: Test
        run: |
          xcodebuild -project ToastDemo.xcodeproj \
            -scheme "ToastDemoUITests" \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            test
